name: Build and optionally publish one revision

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      label:
        required: true
        type: string
      mode:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      sha: ${{ inputs.sha }}
      label: ${{ inputs.label }}

  publish:
    needs: build
    if: inputs.mode == 'stable' || inputs.mode == 'nightly'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.17
      - run: uv sync --locked --no-dev --python 3.12
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: packages-${{ inputs.label }}-*
          merge-multiple: true
          path: dist
      - name: Publish verified package set
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.sha }}
          BUILD_LABEL: ${{ inputs.label }}
          BUILD_MODE: ${{ inputs.mode }}
          RECIPE_SHA: ${{ github.sha }}
        run: >-
          uv run --no-sync python -m tools.publish --directory dist --mode "$BUILD_MODE"
          --sha "$SOURCE_SHA" --label "$BUILD_LABEL" --recipe "$RECIPE_SHA"

  # A stable release whose rebuild failed is hidden until a later run succeeds.
  # Consumers fall back to a source build in the meantime.
  withdraw:
    needs: [build, publish]
    if: >-
      inputs.mode == 'stable' && !cancelled()
      && (needs.build.result != 'success' || needs.publish.result != 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.17
      - run: uv sync --locked --no-dev --python 3.12
      - name: Withdraw the stale release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.sha }}
          BUILD_LABEL: ${{ inputs.label }}
          RECIPE_SHA: ${{ github.sha }}
        run: >-
          uv run --no-sync python -m tools.publish --mode withdraw
          --sha "$SOURCE_SHA" --label "$BUILD_LABEL" --recipe "$RECIPE_SHA"
