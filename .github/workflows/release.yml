name: Build and optionally publish one revision

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      label:
        required: true
        type: string
      mode:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      sha: ${{ inputs.sha }}
      label: ${{ inputs.label }}

  publish:
    needs: build
    if: inputs.mode == 'stable' || inputs.mode == 'nightly'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.17
      - run: uv sync --locked --no-dev --python 3.12
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: packages-${{ inputs.label }}-*
          merge-multiple: true
          path: dist
      - name: Publish verified package set
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.sha }}
          BUILD_LABEL: ${{ inputs.label }}
          BUILD_MODE: ${{ inputs.mode }}
          RECIPE_SHA: ${{ github.sha }}
        run: >-
          uv run --no-sync python -m tools.publish --directory dist --mode "$BUILD_MODE"
          --sha "$SOURCE_SHA" --label "$BUILD_LABEL" --recipe "$RECIPE_SHA"
