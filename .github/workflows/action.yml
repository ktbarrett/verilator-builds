name: Test setup action

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            version: nightly
            force-source: 'false'
          - runner: ubuntu-24.04-arm
            version: nightly
            force-source: 'false'
          - runner: macos-15-intel
            version: nightly
            force-source: 'false'
          - runner: macos-26
            version: nightly
            force-source: 'false'
          # This release predates our binary archive support.
          - runner: ubuntu-24.04
            version: '5.046'
            force-source: 'false'
          # Exercise native macOS builds even when nightly binaries exist.
          - runner: macos-26
            version: nightly
            force-source: 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: action-under-test
          persist-credentials: false
      - uses: ./action-under-test
        id: verilator
        with:
          version: ${{ matrix.version }}
          force-source: ${{ matrix.force-source }}
      - name: Compile and simulate using the installed Verilator
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          FIXTURES: ${{ github.workspace }}/action-under-test/tests/smoke
          SOURCE_SHA: ${{ steps.verilator.outputs.source-sha }}
          INSTALLED_PATH: ${{ steps.verilator.outputs.path }}
          BUILT_FROM_SOURCE: ${{ steps.verilator.outputs.built-from-source }}
          EXPECT_SOURCE: ${{ matrix.force-source == 'true' || matrix.version == '5.046' }}
        run: |
          test "$(command -v verilator)" = "$INSTALLED_PATH/bin/verilator"
          verilator --version | grep -F "$SOURCE_SHA"
          if [ "$EXPECT_SOURCE" = true ]; then
            test "$BUILT_FROM_SOURCE" = true
          fi
          verilator --lint-only "$FIXTURES/top.sv"
          verilator --cc --exe --trace --coverage --top-module top \
            --Mdir obj_dir "$FIXTURES/top.sv" "$FIXTURES/main.cpp"
          make -C obj_dir -f Vtop.mk -j2
          ./obj_dir/Vtop
          test -s trace.vcd
          test -s coverage.dat
          verilator_coverage --write-info coverage.info coverage.dat
