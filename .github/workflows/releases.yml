name: Build releases

# Rebuild and publish every release that the current recipe has not built, plus
# the rolling nightly. This workflow is plumbing and provisioning only; it is not
# part of the recipe digest. Build logic lives in tools/.

on:
  push:
    branches: [dev]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Share one group across every run. GitHub may coalesce pending runs; discovery
# retries anything still missing on the next run.
concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.discover.outputs.builds }}
      releases: ${{ steps.discover.outputs.releases }}
      has_builds: ${{ steps.discover.outputs.has_builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.17
      - run: uv sync --locked --no-dev --python 3.12
      - id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -m tools.discover

  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.17
      - run: uv sync --locked --no-dev --python 3.12
      - env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -m tools.publish --mode cleanup

  build:
    name: Build ${{ matrix.label }} (${{ matrix.platform }})
    needs: [discover, cleanup]
    if: needs.discover.outputs.has_builds == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ matrix.sha }}
      BUILD_LABEL: ${{ matrix.label }}
      BUILD_PLATFORM: ${{ matrix.platform }}
      RECIPE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: verilator/verilator
          ref: ${{ matrix.sha }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.17
      - run: uv sync --locked --no-dev --python 3.12
      - name: Build Linux in manylinux
        if: runner.os == 'Linux'
        run: >-
          uv run --no-sync python -m tools.linux --platform "$BUILD_PLATFORM" --sha "$SOURCE_SHA"
          --label "$BUILD_LABEL" --recipe "$RECIPE_SHA"
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install autoconf bison flex help2man
      - name: Build macOS
        if: runner.os == 'macOS'
        run: >-
          uv run --no-sync python -m tools.build --source upstream --platform "$BUILD_PLATFORM"
          --sha "$SOURCE_SHA" --label "$BUILD_LABEL" --recipe "$RECIPE_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-${{ matrix.label }}-${{ matrix.platform }}
          path: |
            dist/*-${{ matrix.platform }}.tar.gz
            dist/${{ matrix.platform }}.manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.source_asset
        with:
          name: packages-${{ matrix.label }}-source
          path: dist/*-source.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Runs for every release once all builds have finished, including releases
  # with a failed platform: publication then fails on the missing package and
  # the stale stable release is withdrawn to a draft until a later run succeeds.
  publish:
    name: Publish ${{ matrix.label }}
    needs: [discover, build]
    if: ${{ !cancelled() && needs.discover.outputs.has_builds == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.releases) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ matrix.sha }}
      BUILD_LABEL: ${{ matrix.label }}
      BUILD_MODE: ${{ matrix.mode }}
      RECIPE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.17
      - run: uv sync --locked --no-dev --python 3.12
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: packages-${{ matrix.label }}-*
          merge-multiple: true
          path: dist
      - name: Publish verified package set
        run: >-
          uv run --no-sync python -m tools.publish --directory dist --mode "$BUILD_MODE"
          --sha "$SOURCE_SHA" --label "$BUILD_LABEL" --recipe "$RECIPE_SHA"
      - name: Withdraw the stale release
        if: failure() && matrix.mode == 'stable'
        run: >-
          uv run --no-sync python -m tools.publish --mode withdraw
          --sha "$SOURCE_SHA" --label "$BUILD_LABEL" --recipe "$RECIPE_SHA"
