name: Check build infrastructure

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.6
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v

  # Use the oldest release supported by every target, without release credentials.
  packages:
    uses: ./.github/workflows/build.yml
    needs: resolve
    with:
      sha: ${{ needs.resolve.outputs.sha }}
      label: ci-${{ github.run_id }}-${{ github.run_attempt }}

  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.matrix --seed
