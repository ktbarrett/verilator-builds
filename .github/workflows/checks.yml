name: Check build infrastructure

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.17
      - run: uv sync --locked --python 3.12
      - run: uv run --no-sync pre-commit run --all-files
      - run: uv run --no-sync python -m pytest

  # The current recipe must build every supported release. Exercise every target
  # using upstream HEAD and the oldest supported release.
  packages:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - sha: ${{ needs.resolve.outputs.sha }}
            label: master
          - sha: ${{ needs.resolve.outputs.oldest_sha }}
            label: ${{ needs.resolve.outputs.oldest }}
    uses: ./.github/workflows/build.yml
    with:
      sha: ${{ matrix.sha }}
      label: ${{ matrix.label }}

  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      oldest: ${{ steps.resolve.outputs.oldest }}
      oldest_sha: ${{ steps.resolve.outputs.oldest_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.17
      - run: uv sync --locked --no-dev --python 3.12
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -m tools.matrix --seed
